<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognitive Controller Control Plane</title>
    <script>
      // Foolproof client-side runtime error visualizer
      (function() {
        function displayFatalError(type, message, details) {
          const id = 'tfs-fatal-err-overlay';
          if (document.getElementById(id)) return;
          
          const overlay = document.createElement('div');
          overlay.id = id;
          overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;background-color:#7f1d1d;color:#fca5a5;z-index:99999999;padding:24px;font-family:ui-monospace,monospace;font-size:14px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,0.5);border-bottom:4px solid #ef4444;box-sizing:border-box;max-height:80vh;overflow-y:auto;';
          
          let html = `
            <div style="font-weight:bold;font-size:18px;color:#ffffff;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
              <span>🚨 CLIENT-SIDE FATAL RUNTIME: ${type}</span>
            </div>
            <div style="background-color:#450a0a;padding:16px;border-radius:8px;border:1px solid #991b1b;margin-bottom:12px;font-weight:bold;color:#fecaca;word-break:break-all;">
              ${message}
            </div>
          `;
          
          if (details) {
            html += `<pre style="background-color:#0f172a;color:#cbd5e1;padding:16px;border-radius:8px;margin:0;font-size:12px;white-space:pre-wrap;word-break:break-all;border:1px solid rgba(255,255,255,0.05);">${details}</pre>`;
          }
          
          overlay.innerHTML = html;
          document.body.appendChild(overlay);
        }

        window.addEventListener('error', function(event) {
          // Exclude benign resource load issues (which don't have errors or messages)
          if (!event.message && !event.filename && !event.error) return;
          const msg = event.message || 'Unknown Runtime Script Error';
          const file = event.filename ? (event.filename + ':' + event.lineno + ':' + event.colno) : 'Unknown location';
          const stack = event.error ? event.error.stack : 'No call-stack available (eval/external script?)';
          displayFatalError('Uncaught JS Exception', msg, `Location: ${file}\n\nCall-stack:\n${stack}`);
        });

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = reason ? (reason.message || String(reason)) : 'Unhandled Promise Rejection';
          const stack = (reason && reason.stack) ? reason.stack : 'N/A';
          displayFatalError('Unhandled Promise Rejection', msg, `Call-stack:\n${stack}`);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="tfs-boot-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #0c0a09; color: #f5f5f4; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding: 24px; text-align: center; margin: 0; box-sizing: border-box;">
        <div style="border: 1px solid rgba(255,255,255,0.08); background-color: #1c1917; padding: 40px; border-radius: 16px; max-width: 440px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <!-- Logo Circle -->
          <div style="width: 48px; height: 48px; background-color: rgba(16,185,129,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto;">
            <div style="width: 20px; height: 20px; background-color: #10b981; border-radius: 50%;"></div>
          </div>
          <div style="margin-bottom: 24px; font-weight: 800; font-size: 14px; color: #ffffff; letter-spacing: 0.15em; text-transform: uppercase;">Cognitive Controller Control Plane</div>
          
          <!-- Modern Spinner -->
          <div id="tfs-boot-spinner" style="border: 2.5px solid rgba(16,185,129,0.1); border-top: 2.5px solid #10b981; border-radius: 50%; width: 28px; height: 28px; animation: tfs-spin 0.8s linear infinite; margin: 0 auto 24px auto;"></div>
          
          <div id="tfs-boot-status" style="font-size: 12px; color: #a8a29e; margin-bottom: 8px; font-weight: 500;">Booting Application Engine</div>
          <div id="tfs-boot-substatus" style="font-size: 10px; color: #78716c; letter-spacing: 0.02em;">Loading static bundle chunks...</div>
        </div>
        <style>
          @keyframes tfs-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module">
      window.addEventListener('DOMContentLoaded', () => {
        const sub = document.getElementById('tfs-boot-substatus');
        if (sub) sub.textContent = 'Assembling JS and CSS modules...';
      });
      window.onload = () => {
        const sub = document.getElementById('tfs-boot-substatus');
        if (sub) sub.textContent = 'Mounting interface components...';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
